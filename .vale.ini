# Repo-local prose gate for the skills. Canonical home: this repo.
#
# The org prose rules run separately. .github/workflows/vale.yml is synced
# from portolan-sdi/portolan-ops and calls reusable-vale.yml, which passes
# `--config ../ops/.vale.ini` on the command line. That run never reads this
# file, and this file never changes it.
#
# This gate adds one style, ai-tells, which reports the AI writing patterns
# that AGENTS.md already forbids: idioms, metaphors, figurative language,
# hype words, and filler. See https://github.com/tbhb/vale-ai-tells.

StylesPath = .vale/styles
MinAlertLevel = error

# Pinned to a release rather than the bare catalog name, so a rule change
# upstream reaches this repo when someone moves this line.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.33.0/ai-tells.zip

[{skills/**/*.md,README.md}]
BasedOnStyles = ai-tells

# A backticked command, a path, and an identifier are exact. Vale masks a
# code span before matching, but the mask still carries the span's length,
# so a rule on punctuation can still report inside it. These ignores drop
# the span from the buffer instead.
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+)

# Its message asks for the contraction "doesn't". The Simplified Technical
# English style this repo writes in allows only simple full verb forms.
ai-tells.NegatedObject = NO

# It reports "implements". AGENTS.md states that the CLI implements the
# specification, and portolan-spec is ground truth. The word is exact.
ai-tells.FormalRegister = NO

# Every match in this repo is a CLI flag inside a code span, such as
# `portolan check --fix`. vale masks a code span before it matches, but a
# punctuation token still reports at the raw position inside the mask.
# tbhb/vale-ai-tells records that limitation in its TODO.md.
ai-tells.DoubleHyphen = NO

# It reports a run-in bold label ("**Note:** ...") and the placeholder form
# "<PLACEHOLDER: N>" in skills/portolan-migrate/reference/conformance.md.
# vale-ai-tells turns it off in its own repository for the first reason.
ai-tells.ColonUsage = NO

# AGENTS.md carries the org norms between ops-sync markers. portolan-ops
# owns that text, and a sync run overwrites it here. Report only the prose
# this repo can fix.
[AGENTS.md]
BasedOnStyles = ai-tells
BlockIgnores = (?s)<!-- ops-sync:begin.*?<!-- ops-sync:end -->
ai-tells.DoubleHyphen = NO
ai-tells.NegatedObject = NO
ai-tells.FormalRegister = NO
ai-tells.ColonUsage = NO
