repos:
  - repo: local
    hooks:
      - id: generate-readme
        name: Generate README skills section
        entry: python scripts/generate-readme.py
        language: python
        pass_filenames: false
        files: ^skills/.*/SKILL\.md$|^README\.md$
      - id: check-drift
        name: Check skills against the pinned upstreams
        entry: uv run scripts/check_drift.py --offline
        language: system
        pass_filenames: false
        files: ^skills/.*\.md$|^pins\.toml$|^scripts/check_drift\.py$
      - id: ai-tells
        name: Check the prose against the ai-tells style
        entry: scripts/vale_ai_tells.sh
        language: system
        pass_filenames: false
        files: ^skills/.*\.md$|^README\.md$|^AGENTS\.md$|^\.vale\.ini$
